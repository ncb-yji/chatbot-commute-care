apiVersion: v1
kind: Namespace
metadata:
  name: commute-care
---
apiVersion: v1
kind: Secret
metadata:
  name: commute-care-secrets
  namespace: commute-care
type: Opaque
data:
  seoul-api-key: <BASE64_ENCODED_SEOUL_API_KEY>
  openai-api-key: <BASE64_ENCODED_OPENAI_API_KEY>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commute-care-backend
  namespace: commute-care
  labels:
    app: commute-care-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: commute-care-backend
  template:
    metadata:
      labels:
        app: commute-care-backend
    spec:
      containers:
      - name: backend
        image: commute-care-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: PORT
          value: "8000"
        - name: SEOUL_API_KEY
          valueFrom:
            secretKeyRef:
              name: commute-care-secrets
              key: seoul-api-key
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: commute-care-secrets
              key: openai-api-key
        - name: LOG_LEVEL
          value: "INFO"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: commute-care-backend-service
  namespace: commute-care
spec:
  selector:
    app: commute-care-backend
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commute-care-frontend
  namespace: commute-care
  labels:
    app: commute-care-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: commute-care-frontend
  template:
    metadata:
      labels:
        app: commute-care-frontend
    spec:
      containers:
      - name: frontend
        image: commute-care-frontend:latest
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: commute-care-frontend-service
  namespace: commute-care
spec:
  selector:
    app: commute-care-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: commute-care-ingress
  namespace: commute-care
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: commute-care.your-domain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: commute-care-frontend-service
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: commute-care-backend-service
            port:
              number: 8000 