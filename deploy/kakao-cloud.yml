version: '3.8'

services:
  # 백엔드 서비스 (FastAPI)
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: commute-care-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SEOUL_API_KEY=${SEOUL_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LOG_LEVEL=INFO
    restart: unless-stopped
    networks:
      - commute-care-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 프론트엔드 서비스 (React + Nginx)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: commute-care-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - commute-care-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  commute-care-network:
    driver: bridge 